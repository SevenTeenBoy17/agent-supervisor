[project]
name = "agent-supervisor-core"
version = "3.1.6"
description = "Runtime-neutral goal, evidence, routing, and quality supervisor"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "SevenTeenBoy17"}]
keywords = ["codex", "claude", "agent", "supervisor", "evidence", "quality-gates"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.23"]

[project.urls]
Homepage = "https://github.com/SevenTeenBoy17/agent-supervisor"
Repository = "https://github.com/SevenTeenBoy17/agent-supervisor"
Issues = "https://github.com/SevenTeenBoy17/agent-supervisor/issues"

[project.scripts]
agent-supervisor = "supervisor_core.cli:main"

[tool.setuptools]
packages = ["supervisor_core"]

[tool.setuptools.package-data]
supervisor_core = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:asyncio"
