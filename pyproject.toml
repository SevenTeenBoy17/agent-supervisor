[project]
name = "agent-supervisor-core"
version = "3.0.4"
description = "Runtime-neutral goal, evidence, routing, and quality supervisor"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
agent-supervisor = "supervisor_core.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
