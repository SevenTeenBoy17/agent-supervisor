name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Harden hosted POSIX executable trust chain
        if: runner.os != 'Windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace([string]$env:pythonLocation)) { exit 1 }
          $sourcePython = Join-Path ([string]$env:pythonLocation) 'bin/python'
          if (-not [IO.Path]::IsPathRooted($sourcePython) -or -not (Test-Path -LiteralPath $sourcePython -PathType Leaf)) { exit 1 }
          $powerShellRoot = '/opt/microsoft/powershell/7'
          $env:AGENT_SUPERVISOR_CI_POWERSHELL_ROOT = $powerShellRoot
          $powerShellTrustProbe = @'
          import os
          from pathlib import Path
          import stat

          expected = Path("/opt/microsoft/powershell/7")
          root = expected.resolve(strict=True)
          ancestors = (
              Path("/opt"),
              Path("/opt/microsoft"),
              Path("/opt/microsoft/powershell"),
              expected,
          )
          if root != expected:
              raise SystemExit("CI PowerShell trust root is not canonical")
          for candidate in ancestors:
              info = candidate.lstat()
              if not stat.S_ISDIR(info.st_mode) or stat.S_ISLNK(info.st_mode):
                  raise SystemExit("CI PowerShell trust ancestor is not a real directory")
              if info.st_uid != 0:
                  raise SystemExit("CI PowerShell trust ancestor is not root-owned")
          executable = root / "pwsh"
          executable_info = executable.lstat()
          if not stat.S_ISREG(executable_info.st_mode) or executable_info.st_uid != 0:
              raise SystemExit("CI PowerShell executable is not a root-owned regular file")

          if os.environ["AGENT_SUPERVISOR_CI_POWERSHELL_PHASE"] == "post":
              candidates = (*ancestors, *root.rglob("*"))
              for candidate in candidates:
                  info = candidate.lstat()
                  if stat.S_ISLNK(info.st_mode):
                      resolved = candidate.resolve(strict=True)
                      if not resolved.is_relative_to(root):
                          raise SystemExit("external CI PowerShell link rejected")
                      info = resolved.lstat()
                  if info.st_uid != 0 or info.st_mode & 0o022:
                      raise SystemExit("CI PowerShell trust tree remains writable or unowned")
              print("CI_POWERSHELL_TRUST_TREE_PASS")
          '@
          $env:AGENT_SUPERVISOR_CI_POWERSHELL_PHASE = 'pre'
          $powerShellTrustProbe | & $sourcePython -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & sudo chmod 'go-w' -- '/opt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & sudo chmod 'go-w' -- '/opt/microsoft'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & sudo chmod 'go-w' -- '/opt/microsoft/powershell'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & sudo chmod -R 'go-w' -- $powerShellRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AGENT_SUPERVISOR_CI_POWERSHELL_PHASE = 'post'
          $powerShellTrustProbe | & $sourcePython -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:AGENT_SUPERVISOR_CI_POWERSHELL_PHASE -ErrorAction SilentlyContinue
          Remove-Item Env:AGENT_SUPERVISOR_CI_POWERSHELL_ROOT -ErrorAction SilentlyContinue

      - name: Scan publishable tree and Git history
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          git_command = shutil.which("git")
          if not git_command:
              raise SystemExit("Git is unavailable on this runner")
          git = Path(git_command).resolve(strict=True)
          install_home = Path(os.environ["RUNNER_TEMP"]) / "agent-supervisor-ci"
          registry = install_home / ".agent-supervisor" / "trusted-executables.json"
          registry.parent.mkdir(parents=True, exist_ok=True)
          registry.write_text(
              json.dumps(
                  {
                      "contract": "TrustedExecutableRegistry/v1",
                      "entries": {
                          "git": {
                              "kind": "local",
                              "path": str(git),
                              "sha256": hashlib.sha256(git.read_bytes()).hexdigest(),
                          }
                      },
                      "generated_at": "2000-01-01T00:00:00Z",
                  },
                  sort_keys=True,
              ),
              encoding="utf-8",
          )
          PY
          AGENT_SUPERVISOR_INSTALL_HOME="$RUNNER_TEMP/agent-supervisor-ci" \
            python bin/scan-release-secrets.py --history

      - name: Install project
        run: python -m pip install -e . pytest==8.3.4

      - name: Compile Python sources
        run: python -m compileall -q supervisor_core bin integrations tests

      - name: Prepare hermetic Supervisor test runtime
        shell: pwsh
        run: |
          $env:AGENT_SUPERVISOR_CI_TEST_HOME = $HOME
          $ciPython = ''
          $sourcePython = ''
          $runtimeRoot = ''
          if ($IsWindows) {
            if ([string]::IsNullOrWhiteSpace([string]$env:pythonLocation)) { exit 1 }
            $ciPython = Join-Path ([string]$env:pythonLocation) 'python.exe'
          } else {
            if ([string]::IsNullOrWhiteSpace([string]$env:pythonLocation)) { exit 1 }
            $sourcePython = Join-Path ([string]$env:pythonLocation) 'bin/python'
            $runtimeRoot = "/usr/local/agent-supervisor-ci/python-${{ matrix.python-version }}"
            $runtimeParent = Split-Path -Parent $runtimeRoot
            $uid = [string](& id -u)
            $gid = [string](& id -g)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            sudo install -d -m 0755 -o $uid.Trim() -g $gid.Trim() -- $runtimeParent
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not $IsWindows) {
            if (-not [IO.Path]::IsPathRooted($sourcePython) -or -not (Test-Path -LiteralPath $sourcePython -PathType Leaf)) { exit 1 }
            $env:AGENT_SUPERVISOR_CI_RUNTIME_ROOT = $runtimeRoot
            $runtimeRelative = @'
          import os
          from pathlib import Path
          import shutil
          import stat
          import sys

          REPARSE_POINT = getattr(stat, "FILE_ATTRIBUTE_REPARSE_POINT", 0x400)

          def runtime_tree_entries(root: Path):
              pending = [root]
              while pending:
                  directory = pending.pop()
                  with os.scandir(directory) as entries:
                      for entry in entries:
                          candidate = Path(entry.path)
                          attributes = getattr(
                              candidate.lstat(), "st_file_attributes", 0
                          )
                          link_like = candidate.is_symlink() or bool(
                              attributes & REPARSE_POINT
                          )
                          yield candidate, link_like
                          if not link_like and entry.is_dir(follow_symlinks=False):
                              pending.append(candidate)

          source = Path(sys.base_prefix).resolve(strict=True)
          target = Path(os.environ["AGENT_SUPERVISOR_CI_RUNTIME_ROOT"])
          if target.exists():
              raise SystemExit("CI runtime target already exists")
          target.parent.mkdir(parents=True, exist_ok=True)
          for candidate, link_like in runtime_tree_entries(source):
              if link_like:
                  resolved = candidate.resolve(strict=True)
                  if not resolved.is_relative_to(source):
                      raise SystemExit(
                          f"external runtime link or reparse point rejected: {candidate}"
                      )
          running_executable = Path(sys.executable).resolve(strict=True)
          runtime_source = next(
              (
                  candidate
                  for candidate in (
                      source / "bin" / "python",
                      source / "bin" / "python3",
                  )
                  if candidate.is_file()
                  and candidate.resolve(strict=True) == running_executable
              ),
              None,
          )
          if runtime_source is None:
              raise SystemExit("unversioned CI runtime launcher is unavailable")
          relative_executable = runtime_source.relative_to(source)
          shutil.copytree(source, target, symlinks=False)
          if os.name != "nt":
              target.chmod(stat.S_IMODE(target.lstat().st_mode) & ~0o022)
              for candidate, link_like in runtime_tree_entries(target):
                  if link_like:
                      raise SystemExit("copied CI runtime retained a link or reparse point")
                  candidate.chmod(stat.S_IMODE(candidate.lstat().st_mode) & ~0o022)
              if target.lstat().st_mode & 0o022 or any(
                  candidate.lstat().st_mode & 0o022
                  for candidate, _ in runtime_tree_entries(target)
              ):
                  raise SystemExit("copied CI runtime retained group/other write access")
          elif any(link_like for _, link_like in runtime_tree_entries(target)):
              raise SystemExit("copied CI runtime retained a link or reparse point")
          runtime = target / relative_executable
          if not runtime.is_file():
              raise SystemExit("copied CI runtime executable is missing")
          print(relative_executable)
          '@ | & $sourcePython -
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $runtimeRelative = [string]($runtimeRelative | Select-Object -Last 1)
            $ciPython = Join-Path $runtimeRoot $runtimeRelative.Trim()
            $patchElf = '/usr/bin/patchelf'
            if (-not (Test-Path -LiteralPath $patchElf -PathType Leaf)) { exit 1 }
            $runtimeLibraryRoot = Join-Path $runtimeRoot 'lib'
            & $patchElf --set-rpath $runtimeLibraryRoot $ciPython
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $observedRpath = [string](& $patchElf --print-rpath $ciPython)
            if ($LASTEXITCODE -ne 0 -or $observedRpath.Trim() -cne $runtimeLibraryRoot) { exit 1 }
            Remove-Item Env:LD_LIBRARY_PATH -ErrorAction SilentlyContinue
            & $ciPython -I -S -c "import os,sys; expected=os.path.realpath(os.environ['AGENT_SUPERVISOR_CI_RUNTIME_ROOT']); raise SystemExit(0 if os.path.realpath(sys.prefix)==expected and os.path.realpath(sys.base_prefix)==expected else 1)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:LD_LIBRARY_PATH = $runtimeLibraryRoot
            "LD_LIBRARY_PATH=$runtimeLibraryRoot" >> $env:GITHUB_ENV
          }
          if (-not [IO.Path]::IsPathRooted($ciPython) -or -not (Test-Path -LiteralPath $ciPython -PathType Leaf)) { exit 1 }
          & $ciPython -I -S -c "import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import sys

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          selected = {
              "git": shutil.which("git"),
              "python": sys.executable,
              "pwsh": shutil.which("pwsh") or shutil.which("powershell"),
          }
          if any(not value for value in selected.values()):
              raise SystemExit("CI test dependencies are unavailable")
          executables = {
              name: Path(str(value)).resolve(strict=True)
              for name, value in selected.items()
          }
          install_home = Path(os.environ["AGENT_SUPERVISOR_CI_TEST_HOME"]).resolve()
          registry = install_home / ".agent-supervisor" / "trusted-executables.json"
          registry.parent.mkdir(parents=True, exist_ok=True)
          registry.write_text(
              json.dumps(
                  {
                      "contract": "TrustedExecutableRegistry/v1",
                      "entries": {
                          name: {
                              "kind": "local",
                              "path": str(path),
                              "sha256": digest(path),
                          }
                          for name, path in executables.items()
                      },
                      "generated_at": "2000-01-01T00:00:00Z",
                  },
                  sort_keys=True,
              ),
              encoding="utf-8",
          )
          '@ | & $ciPython -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ciPython bin/install-agent-supervisor.py `
            --source "$env:GITHUB_WORKSPACE" `
            --install-home "$env:AGENT_SUPERVISOR_CI_TEST_HOME" `
            --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "AGENT_SUPERVISOR_CI_PYTHON=$ciPython" >> $env:GITHUB_ENV
          if (-not $IsWindows) {
            "AGENT_SUPERVISOR_CI_RUNTIME_ROOT=$runtimeRoot" >> $env:GITHUB_ENV
            (Join-Path $runtimeRoot 'bin') >> $env:GITHUB_PATH
          }

      - name: Run tests
        shell: pwsh
        run: |
          $pytestArgs = @("-m", "pytest", "-q")
          if (-not $IsWindows) {
            $pytestArgs += "--ignore=tests/test_v311_codex_adapter_security.py"
          }
          & $env:AGENT_SUPERVISOR_CI_PYTHON @pytestArgs

      - name: Verify dry-run installation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: pwsh
        run: '& $env:AGENT_SUPERVISOR_CI_PYTHON bin/install-agent-supervisor.py'

      - name: Build and inspect deterministic release
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: pwsh
        run: |
          & $env:AGENT_SUPERVISOR_CI_PYTHON bin/build-core-release-manifest.py `
            --root . `
            --version 3.1.6 `
            --output .ci-artifacts/supervisor-runtime.zip `
            --identity-output .ci-artifacts/release-identity.json

      - name: Verify installed bound selftest
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: pwsh
        run: |
          $launcher = Join-Path $HOME ".agent-supervisor/bin/agent-supervisor.py"
          & $env:AGENT_SUPERVISOR_CI_PYTHON $launcher selftest

      - name: Build wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: pwsh
        run: '& $env:AGENT_SUPERVISOR_CI_PYTHON -m pip wheel . --no-deps --wheel-dir .ci-artifacts'
